<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBLOC AI Agent</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #121212, #1e1e1e);
            color: #ffffff;
            display: flex;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #avatar-container {
            width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: rgba(30, 30, 30, 0.9);
        }
        .avatar {
            width: 80px;
            height: 80px;
            margin: 10px;
            border: 2px solid transparent;
            border-radius: 50%;
            cursor: pointer;
            object-fit: cover; /* Giữ tỷ lệ ảnh */
            transition: border-color 0.3s;
        }
        .avatar:hover {
            border-color: #007acc;
        }
        .selected {
            border-color: #007acc;
        }
        #selected-avatar {
            max-width: 100%;
            max-height: 200px; /* Giới hạn chiều cao */
            border-radius: 10px;
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid #444;
            border-radius: 10px;
            background-color: #252526;
            margin-bottom: 10px;
        }
        #input-container {
            display: flex;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
            background-color: #333;
            color: #ffffff;
            transition: border-color 0.3s;
        }
        #user-input:focus {
            border-color: #007acc;
            outline: none;
        }
        #send-button {
            padding: 12px 15px;
            border: none;
            background-color: #007acc;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            font-size: 16px;
            margin-left: 10px;
        }
        #send-button:hover {
            background-color: #005a9e;
            transform: scale(1.05);
        }
        .message {
            margin: 10px 0;
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 70%;
            clear: both;
            transition: background-color 0.3s;
        }
        .user-message {
            background-color: #007acc;
            color: #ffffff;
            margin-left: auto;
            text-align: right;
        }
        .bot-message {
            background-color: #444;
            color: #ffffff;
            margin-right: auto;
            text-align: left;
        }
        #auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        #email-input, #password-input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #444;
            border-radius: 5px;
            width: 80%;
            max-width: 300px;
            background-color: #333;
            color: #fff;
        }
        #auth-button {
            padding: 10px 15px;
            border: none;
            background-color: #007acc;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        #auth-button:hover {
            background-color: #005a9e;
        }
    </style>
</head>
<body>
    <div id="avatar-container">
        <img id="selected-avatar" src="" alt="Selected Avatar" style="display:none;">
        <img src="https://img.upanh.tv/2025/01/08/8e98653faada33937d7a90b6434a8952.jpg" class="avatar" onclick="selectAvatar(this)">
        <img src="https://img.upanh.tv/2025/01/08/327194216_108369902131721_3649147020063415428_n.jpg" class="avatar" onclick="selectAvatar(this)">
        <img src="https://img.upanh.tv/2025/01/08/327774532_2113319588877398_3317745821828939319_n.jpg" class="avatar" onclick="selectAvatar(this)">
        <img src="https://img.upanh.tv/2025/01/08/328715379_1831397447243004_2899238298077808247_n.jpg" class="avatar" onclick="selectAvatar(this)">
        <img src="https://img.upanh.tv/2025/01/08/328933052_1291615428054631_7311347318087095915_n-1.jpg" class="avatar" onclick="selectAvatar(this)">
        <img src="https://img.upanh.tv/2025/01/08/329258298_725772729078302_3916261246631329071_n.jpg" class="avatar" onclick="selectAvatar(this)">
        <img src="https://img.upanh.tv/2025/01/08/329335076_873850553869803_2947030033857034245_n.jpg" class="avatar" onclick="selectAvatar(this)">
        <img src="https://img.upanh.tv/2025/01/08/329364678_700251621784649_3437110574540905577_n.jpg" class="avatar" onclick="selectAvatar(this)">
        <img src="https://img.upanh.tv/2025/01/08/329697970_2154569548081116_1766427353973674445_n.jpg" class="avatar" onclick="selectAvatar(this)">
        <img src="https://img.upanh.tv/2025/01/08/329760238_895948491660450_6649622255640634620_n.jpg" class="avatar" onclick="selectAvatar(this)">
        <img src="https://img.upanh.tv/2025/01/08/329930991_191091600196054_2423085782302673358_n.jpg" class="avatar" onclick="selectAvatar(this)">
        <button id="confirm-avatar" style="margin-top: 10px; display: none;" onclick="confirmAvatar()">Chọn Avatar</button>
    </div>
    <div id="chat-container">
        <div id="chat-box"></div>
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Nhập câu hỏi của bạn..." />
            <button id="send-button">Gửi</button>
        </div>
    </div>
    <div id="auth-container">
        <input type="email" id="email-input" placeholder="Email" />
        <input type="password" id="password-input" placeholder="Mật khẩu" />
        <button id="auth-button">Đăng Nhập</button>
        <button id="register-button" style="margin-top: 10px;">Đăng Ký</button>
    </div>

    <script>
        let selectedAvatar = '';

        function selectAvatar(avatar) {
            const avatars = document.querySelectorAll('.avatar');
            avatars.forEach(av => av.classList.remove('selected'));
            avatar.classList.add('selected');
            selectedAvatar = avatar.src; // Lưu avatar đã chọn

            const selectedAvatarImg = document.getElementById('selected-avatar');
            selectedAvatarImg.src = selectedAvatar;
            selectedAvatarImg.style.display = 'block'; // Hiển thị ảnh đã chọn
            document.getElementById('confirm-avatar').style.display = 'block'; // Hiển thị nút chọn avatar
        }

        function confirmAvatar() {
            alert(`Bạn đã chọn avatar: ${selectedAvatar}`);
            // Thực hiện các hành động cần thiết để lưu avatar
        }

        const apiKey = 'AIzaSyB3gPKFmtNaK21Uh9C6Ja2un_vVbN1spq4'; // Thay thế YOUR_GEMINI_API_KEY bằng api key của bạn
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        sendButton.addEventListener('click', () => {
            const userMessage = userInput.value;
            if (!userMessage) return;

            displayMessage(userMessage, 'user');
            userInput.value = '';

            fetch('https://api.gemini.com/v1/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({ message: userMessage })
            })
            .then(response => response.json())
            .then(data => {
                displayMessage(data.reply, 'bot');
            })
            .catch(error => {
                console.error('Error:', error);
                displayMessage('Có lỗi xảy ra. Vui lòng thử lại!', 'bot');
            });
        });

        function displayMessage(message, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.textContent = message;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // tự động cuộn xuống
        }
    </script>
</body>
</html>
